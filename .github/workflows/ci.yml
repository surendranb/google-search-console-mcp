name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@169116e0c6515cb684c31bc37ea920c5d6e2cf06 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run pytest -v
