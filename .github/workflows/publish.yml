name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  build-distributions:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build distributions with uv
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-distributions]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-to-npm:
    name: Publish NPX wrapper to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          cd npm
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [publish-to-pypi, publish-to-npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # `gh release create --verify-tag` needs the repo on disk: without this
      # checkout the job dies with "fatal: not a git repository".
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create release for tag if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

  publish-to-mcp-registry:
    name: Publish to official MCP registry
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      MCP_PUBLISHER_VERSION: v1.8.16

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      # shortcut: installs from the pinned module tag via sum.golang.org instead of the
      # release tarball + cosign verify-blob flow the registry docs prescribe. The binary
      # reports its version as "dev", which we do not use. Move to the verified tarball if
      # the version string ever needs to be asserted in CI.
      - name: Install mcp-publisher
        run: |
          go install "github.com/modelcontextprotocol/registry/cmd/publisher@${MCP_PUBLISHER_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # GitHub OIDC proves this repo belongs to the io.github.surendranb namespace, so no
      # long-lived registry token secret is needed and nothing can expire silently.
      - name: Authenticate to the registry
        run: publisher login github-oidc

      - name: Publish server.json
        run: |
          # release.yml runs on both tag push and release publish, so a second run
          # re-publishes an identical version. Mirrors skip-existing on the PyPI step:
          # a duplicate is success, every other failure is not.
          if out=$(publisher publish server.json 2>&1); then
            echo "$out"
          else
            echo "$out"
            grep -q "cannot publish duplicate version" <<<"$out" || exit 1
            echo "::notice::already published; registry untouched"
          fi
