[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-search-console-mcp"
version = "0.10.6"
description = "The GSC 'Intel Engine' for the evolving search landscape. Authoritative visibility governance and AI overview citation analysis via Model Context Protocol."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Surendran B", email = "reachsuren@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["google-search-console", "gsc", "seo", "search-analytics", "mcp", "mcp-server", "model-context-protocol", "claude", "cursor", "ai-agents"]
dependencies = [
    # MCP 2.0 (2026-07-28 spec). The standalone `fastmcp` package pins mcp<2.0
    # and cannot speak the new spec, so we depend on the official SDK directly.
    "mcp>=2.0.0,<3",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=0.4.0",
    "google-auth-httplib2>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/surendranb/google-search-console-mcp"
Repository = "https://github.com/surendranb/google-search-console-mcp.git"
Issues = "https://github.com/surendranb/google-search-console-mcp/issues"

[project.scripts]
google-search-console-mcp = "gsc_mcp_server:main"
gsc-mcp = "gsc_mcp_server:main"
gsc-mcp-server = "gsc_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
include = [
    "gsc_mcp_server.py",
    "gsc_telemetry.py",
    "gsc_setup_flow.py",
    "gsc_dimensions.json",
    "gsc_metrics.json",
    "gsc_filters.json",
    "skills/*.md",
    "README.md",
    "LICENSE"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end user-flow tests (server subprocess, telemetry capture)",
]
