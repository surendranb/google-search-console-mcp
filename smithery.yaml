startCommand:
  type: stdio
  command: "uvx"
  args:
    - "google-search-console-mcp"

configSchema:
  type: object
  required:
    - GOOGLE_APPLICATION_CREDENTIALS
    - GSC_SITE_URL
  properties:
    GOOGLE_APPLICATION_CREDENTIALS:
      type: string
      description: "Absolute path to your Google Cloud service account JSON key file with GSC access."
    GSC_SITE_URL:
      type: string
      description: "Verified Google Search Console site URL (e.g. https://example.com/)."
